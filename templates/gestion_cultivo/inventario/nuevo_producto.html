{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Nuevo Producto</h1>
            <a href="{% url 'gestion_cultivo:inventario' %}" class="text-gray-600 hover:text-gray-800">
                <i class="fas fa-times text-2xl"></i>
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Semillas -->
            <a href="{% url 'gestion_cultivo:crear_semilla' %}" class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
                <div class="flex items-center space-x-4">
                    <div class="bg-green-100 p-3 rounded-full">
                        <i class="fas fa-seedling text-2xl text-green-600"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">Semilla</h2>
                        <p class="text-gray-600">Agregar nueva semilla al inventario</p>
                    </div>
                </div>
            </a>

            <!-- Fertilizantes -->
            <a href="{% url 'gestion_cultivo:crear_fertilizante' %}" class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-100 p-3 rounded-full">
                        <i class="fas fa-flask text-2xl text-blue-600"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">Fertilizante</h2>
                        <p class="text-gray-600">Agregar nuevo fertilizante al inventario</p>
                    </div>
                </div>
            </a>

            <!-- Contenedores -->
            <a href="{% url 'gestion_cultivo:crear_contenedor' %}" class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
                <div class="flex items-center space-x-4">
                    <div class="bg-yellow-100 p-3 rounded-full">
                        <i class="fas fa-box text-2xl text-yellow-600"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">Contenedor</h2>
                        <p class="text-gray-600">Agregar nuevo contenedor al inventario</p>
                    </div>
                </div>
            </a>

            <!-- Maquinaria -->
            <a href="{% url 'gestion_cultivo:crear_maquinaria' %}" class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
                <div class="flex items-center space-x-4">
                    <div class="bg-purple-100 p-3 rounded-full">
                        <i class="fas fa-tools text-2xl text-purple-600"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-gray-800">Maquinaria</h2>
                        <p class="text-gray-600">Agregar nueva maquinaria al inventario</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
