{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Agregar Nueva Maquinaria</h1>
            <a href="{% url 'inventario' %}" class="text-gray-600 hover:text-gray-800">
                <i class="fas fa-arrow-left mr-2"></i>
                Volver al Inventario
            </a>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="space-y-2">
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.help_text %}
                    <p class="text-sm text-gray-500">{{ field.help_text }}</p>
                    {% endif %}
                    {% if field.errors %}
                    <div class="text-red-500 text-sm">
                        {{ field.errors }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="flex justify-end space-x-4 mt-6">
                    <a href="{% url 'inventario' %}" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                        Cancelar
                    </a>
                    <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">
                        Guardar Maquinaria
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
